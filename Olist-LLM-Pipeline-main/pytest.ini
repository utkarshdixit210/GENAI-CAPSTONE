[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: marks tests as integration tests (may be slow, use mocks for LLM/MCP)
    unit: marks tests as unit tests (fast, fully isolated)

# Logging
log_cli = true
log_cli_level = WARNING
log_level = WARNING

# Output
addopts = -v --tb=short -p no:warnings
